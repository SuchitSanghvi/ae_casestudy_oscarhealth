version: 2

unit_tests:

  - name: test_dim_drug_deduplicates_by_drug_code
    description: >
      When the same drug_code appears multiple times in stg_prescription_drugs,
      QUALIFY ROW_NUMBER() must keep exactly one row per drug_code — the one that
      sorts first by (drug_category, drug_group, drug_class).
    model: dim_drug
    given:
      - input: ref('stg_prescription_drugs')
        rows:
          - {drug_code: 'NDC001', drug_category: 'Cat B', drug_group: 'Grp 2', drug_class: 'Cls 2'}
          - {drug_code: 'NDC001', drug_category: 'Cat A', drug_group: 'Grp 1', drug_class: 'Cls 1'}
          - {drug_code: 'NDC002', drug_category: 'Cat C', drug_group: 'Grp 3', drug_class: 'Cls 3'}
    expect:
      rows:
        - {drug_code: 'NDC001', drug_category: 'Cat A', drug_group: 'Grp 1', drug_class: 'Cls 1'}
        - {drug_code: 'NDC002', drug_category: 'Cat C', drug_group: 'Grp 3', drug_class: 'Cls 3'}

models:
  - name: dim_member
    columns:
      - name: member_id
        tests:
          - unique
          - not_null

  - name: dim_date
    columns:
      - name: date_of_service
        tests:
          - unique
          - not_null

  - name: dim_diagnosis
    columns:
      - name: diagnosis_code
        tests:
          - unique
          - not_null

  - name: dim_drug
    columns:
      - name: drug_code
        tests:
          - unique
          - not_null

  - name: fct_diagnosis
    columns:
      - name: record_id
        tests:
          - unique
          - not_null
      - name: member_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_member')
                field: member_id
      - name: date_of_service
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_of_service
      - name: diagnosis_code
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_diagnosis')
                field: diagnosis_code

  - name: fct_prescription_filled
    columns:
      - name: record_id
        tests:
          - unique
          - not_null
      - name: member_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_member')
                field: member_id
      - name: date_of_service
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_of_service
      - name: drug_code
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_drug')
                field: drug_code
